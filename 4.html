<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">
        <h1 class="text-center mb-4">Today's Menu</h1>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Margherita Pizza</td>
                    <td>Main Course</td>
                    <td>$12</td>
                </tr>
                <tr>
                    <td>Veg Burger</td>
                    <td>Fast Food</td>
                    <td>$8</td>
                </tr>
                <tr>
                    <td>French Fries</td>
                    <td>Snacks</td>
                    <td>$5</td>
                </tr>
                <tr>
                    <td>Momo Dumplings</td>
                    <td>Starter</td>
                    <td>$6</td>
                </tr>
            </tbody>
        </table>

        <h3 class="mt-5">Chef's Specials</h3>
        <ul class="list-group mb-4">
            <li class="list-group-item">Cheese Burst Pizza</li>
            <li class="list-group-item">BBQ Wings</li>
            <li class="list-group-item">Hot Chocolate Lava Cake</li>
        </ul>

        <div class="text-center">
            <img src="https://via.placeholder.com/400x250" class="img-fluid">
            <p class="lead mt-2">Delicious meals prepared fresh for you.</p>
        </div>
    </div>

</body>

</html>
