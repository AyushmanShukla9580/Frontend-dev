<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">
        <h1 class="text-center mb-4">Choose Your Plan</h1>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card plan-card">
                    <div class="card-body text-center">
                        <h3>Basic</h3>
                        <h2>$10</h2>
                        <p>5GB Storage</p>
                        <p>Email Support</p>
                        <button class="btn btn-outline-primary">Select</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card bg-primary text-white plan-card">
                    <div class="card-body text-center">
                        <h3>Pro</h3>
                        <h2>$20</h2>
                        <p>20GB Storage</p>
                        <p>Priority Support</p>
                        <button class="btn btn-light">Select</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card plan-card">
                    <div class="card-body text-center">
                        <h3>Premium</h3>
                        <h2>$30</h2>
                        <p>50GB Storage</p>
                        <p>24/7 Support</p>
                        <button class="btn btn-outline-primary">Select</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
