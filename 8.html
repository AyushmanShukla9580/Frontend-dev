<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>

<body>

    <h1>ABC High School</h1>

    <table border="1" title="Marks of the student">
        <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Math</td>
                <td>95</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>90</td>
            </tr>
            <tr>
                <td>English</td>
                <td>88</td>
            </tr>
            <tr>
                <td>History</td>
                <td>85</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>92</td>
            </tr>
            <tr>
                <td colspan="1"><strong>Total</strong></td>
                <td>450</td>
            </tr>
            <tr>
                <td colspan="1"><strong>Percentage</strong></td>
                <td>90%</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
