<!DOCTYPE html>
<html>

<head>
    <style>
        /* Styling the label */
        
        label {
            font-size: 18px;
            font-weight: bold;
            margin-right: 10px;
            font-family: Arial, sans-serif;
        }
        /* Styling the dropdown */
        
        select {
            padding: 8px 12px;
            font-size: 16px;
            border: 2px solid #4CAF50;
            border-radius: 5px;
            background-color: #f9f9f9;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        /* Change border color when dropdown is clicked */
        
        select:focus {
            border-color: #2e7d32;
            outline: none;
        }
    </style>
</head>

<body>
    <label for="cars">Choose a car</label>
    <select id="cars" name="cars">
        <option value="audi">audi</option>
        <option value="BMW">BMW</option>
        <option value="Maruti">Maruti</option>
    
    </select>

</body>

</html>
