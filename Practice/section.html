<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Div, Section, Article Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        div {
            background: #f0f0f0;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        section {
            background: #dff3ff;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        article {
            background: #ffe6cc;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>Understanding Div, Section, and Article</h1>

    <!-- DIV -->
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Div, Section, Article Example</title>
    </head>

    <body>

        <!-- HEADER -->
        <header>
            <h1>Day Name Finder</h1>
            <hr>
        </header>

        <!-- SECTION (Main Topic Section) -->
        <section>
            <h2>Switch Case Example</h2>

            <!-- ARTICLE (Independent Content Block) -->
            <article>
                <h3>Find Day Using Switch Case</h3>

                <!-- DIV (Just a container) -->

            </article>
        </section>

        <!-- FOOTER -->
        <footer>
            <hr>
            <p>&copy; 2025 Day Finder Program</p>
        </footer>

    </body>

    </html>

</body>

</html>
