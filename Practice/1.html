<!DOCTYPE html>
<html>

<head>
    <title>ID Example</title>
    <style>
        .heading {
            border: 2px solid black;
            padding: 10px;
            margin: 5px;
            background-color: lightgray;
        }
        
        #heading {
            color: blue;
            text-align: center;
            font-size: large;
        }
        
        #paragraph {
            color: red;
            text-align: left;
            font-size: small;
            font-style: italic;
        }
        
        input[value="Hello"] {
            border: 2px solid red;
        }
        
        #username {
            border: 2px solid blue;
        }
        
        .input-field {
            padding: 10px;
            background: lightyellow;
        }
    </style>

</head>

<body>
    <h1 id="heading">welcome</h1>
    <p id="paragraph">welcome to my page.</p>
    <p class="heading">hello guys</p>
    <img src="photo.jpg" alt="Image">
    <p title="this is my page">hello everyone</p>
    <input type="text" value="Hello">
    <option value="2" selected>Option 2</option>
    <input type="text" id="username" class="input-field" placeholder="enter value"> </body>

</html>
