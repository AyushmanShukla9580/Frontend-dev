<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item active" data-bs-interval="3000">
                <img src="https://via.placeholder.com/1200x500" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Paris</h3>
                    <p>City of Lights</p>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://via.placeholder.com/1200x500" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Maldives</h3>
                    <p>Blue Paradise</p>
                </div>
            </div>

            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://via.placeholder.com/1200x500" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Switzerland</h3>
                    <p>Heaven on Earth</p>
                </div>
            </div>

        </div>
    </div>

    <div class="container mt-5">
        <h4>Booking Progress</h4>
        <div class="progress mt-2">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%"></div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        Contact: travel@agency.com | +91 9876543210
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
