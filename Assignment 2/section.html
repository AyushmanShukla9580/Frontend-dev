<!DOCTYPE html>

<head>

    <title>My First Webpage</title>
    <style>

    <nav>

    <main>
        <section id="about-me">
            <h2>About Me</h2>
            <p>
                Hi! I am Ayushman, a beginner web developer passionate about learning HTML, CSS, and JavaScript. I enjoy building simple, interactive web pages and exploring new technologies in web development.
            </p>

</html>
