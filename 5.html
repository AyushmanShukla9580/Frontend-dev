<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="text-center py-4 bg-primary text-white">
        <h1>My Travel Blog</h1>
    </header>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card">
                    <img src="https://via.placeholder.com/500x250" class="card-img-top">
                    <div class="card-body">
                        <h4 class="card-title">Exploring the Mountains</h4>
                        <p>Adventure trip with breathtaking views.</p>
                        <button class="btn btn-primary">Read More</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <img src="https://via.placeholder.com/500x250" class="card-img-top">
                    <div class="card-body">
                        <h4 class="card-title">A Day at the Beach</h4>
                        <p>Relaxing with sunshine and blue water.</p>
                        <button class="btn btn-primary">Read More</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 bg-dark text-white">
        © 2025 My Travel Blog
    </footer>

</body>

</html>
