<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection</title>
</head>

<body>

    <header>
        <h1>Choose Your Preferences</h1>
    </header>

    <main>
        <form>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option selected>India</option>
                <option>USA</option>
                <option>UK</option>
            </select>
            <br><br>

            <label for="state">State:</label>
            <select id="state" name="state">
                <option selected>Maharashtra</option>
                <option>Karnataka</option>
                <option>Delhi</option>
            </select>
            <br><br>

            <label for="city">City:</label>
            <select id="city" name="city">
                <option selected>Mumbai</option>
                <option>Bangalore</option>
                <option>Delhi</option>
            </select>
            <br><br>

            <label for="tourist">Favorite Tourist Place:</label>
            <select id="tourist" name="tourist">
                <option selected>Gateway of India</option>
                <option>Marine Drive</option>
                <option>Lalbagh</option>
            </select>
            <br><br>

            <p>You have chosen: India → Maharashtra → Mumbai → Gateway of India</p>
        </form>
    </main>

    <footer>
        <p>© 2025 Travel Selector</p>
    </footer>

</body>

</html>
