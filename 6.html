<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <div class="card p-4 mb-4">
            <div class="alert alert-success">New message received</div>
            <div class="alert alert-info">Tip: Update your profile</div>
            <div class="alert alert-danger">Warning: Storage almost full</div>

            <div class="alert alert-warning alert-dismissible fade show">
                Dismissible Alert
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <div class="bg-light p-4 border rounded">
            <h4>Summary</h4>
            <p>You have 3 unread notifications.</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
